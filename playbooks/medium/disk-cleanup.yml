---
# Free disk space: package cache, old journal logs, rotated logs, old /tmp files, docker junk.
# Usage:
#   ansible-playbook playbooks/medium/disk-cleanup.yml
#   ansible-playbook playbooks/medium/disk-cleanup.yml -e log_retention_days=3 -e docker_prune=true
- name: Disk cleanup
  hosts: all
  become: true
  vars:
    log_retention_days: 7
    tmp_retention_days: 7
    journal_max_size: 200M
    docker_prune: false
  tasks:
    - name: Disk usage before
      ansible.builtin.command: df -h /
      register: df_before
      changed_when: false

    - name: Clean package manager cache
      ansible.builtin.command: "{{ ansible_pkg_mgr }} clean all"
      changed_when: true

    - name: Vacuum systemd journal
      ansible.builtin.command: journalctl --vacuum-size={{ journal_max_size }}
      register: journal
      changed_when: "'freed 0B' not in journal.stderr"

    - name: Find old rotated / compressed logs
      ansible.builtin.find:
        paths: /var/log
        patterns: ["*.gz", "*.[0-9]", "*-[0-9]*", "*.old"]
        age: "{{ log_retention_days }}d"
        recurse: true
      register: old_logs

    - name: Find old files in /tmp
      ansible.builtin.find:
        paths: /tmp
        age: "{{ tmp_retention_days }}d"
        recurse: true
        file_type: file
      register: old_tmp

    - name: Delete old logs and tmp files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_logs.files + old_tmp.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Check if docker is installed
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin

    - name: Prune unused docker data
      ansible.builtin.command: docker system prune -af --filter "until=168h"
      register: prune
      changed_when: "'Total reclaimed space: 0B' not in prune.stdout"
      when: docker_prune | bool and docker_bin.stat.exists

    - name: Disk usage after
      ansible.builtin.command: df -h /
      register: df_after
      changed_when: false

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Removed {{ old_logs.files | length }} old log files and {{ old_tmp.files | length }} tmp files"
          - "Before: {{ df_before.stdout_lines[-1] }}"
          - "After : {{ df_after.stdout_lines[-1] }}"
