---
# Baseline SSH hardening + fail2ban-style protection basics.
# Make sure you can log in with a key BEFORE running this (password auth gets disabled).
# Usage: ansible-playbook playbooks/medium/harden-ssh.yml [--check --diff]
- name: SSH hardening
  hosts: all
  become: true
  vars:
    sshd_settings:
      PermitRootLogin: "no"
      PasswordAuthentication: "no"
      PermitEmptyPasswords: "no"
      X11Forwarding: "no"
      MaxAuthTries: "4"
      ClientAliveInterval: "300"
      ClientAliveCountMax: "2"
      LoginGraceTime: "60"
  tasks:
    - name: Apply sshd settings
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?\\s*{{ item.key }}\\s"
        line: "{{ item.key }} {{ item.value }}"
        validate: /usr/sbin/sshd -t -f %s
        backup: true
      loop: "{{ sshd_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      notify: Reload sshd

    - name: Set secure permissions on sshd_config
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        mode: "0600"
        owner: root
        group: root

    - name: Find drop-in configs that may override settings
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
        contains: "^\\s*(PasswordAuthentication|PermitRootLogin)\\s"
      register: overrides

    - name: Warn about overriding drop-ins
      ansible.builtin.debug:
        msg: "Check these files, they may override hardening: {{ overrides.files | map(attribute='path') | list }}"
      when: overrides.matched | default(0) > 0

  handlers:
    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: sshd
        state: reloaded
