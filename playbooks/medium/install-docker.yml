---
# Install Docker + compose plugin on Amazon Linux 2 / 2023 and add users to the docker group.
# Usage: ansible-playbook playbooks/medium/install-docker.yml
- name: Install Docker
  hosts: all
  become: true
  vars:
    docker_users: [ec2-user]
    compose_version: "v2.29.7"
    compose_arch_map:
      x86_64: x86_64
      aarch64: aarch64
  tasks:
    - name: Install docker package
      ansible.builtin.package:
        name: docker
        state: present

    - name: Start and enable docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"

    - name: Create CLI plugins directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    - name: Install docker compose plugin
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/{{ compose_version }}/docker-compose-linux-{{ compose_arch_map[ansible_architecture] }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"

    - name: Verify installation
      ansible.builtin.command: "{{ item }}"
      loop:
        - docker --version
        - docker compose version
      register: versions
      changed_when: false

    - name: Show versions
      ansible.builtin.debug:
        msg: "{{ versions.results | map(attribute='stdout') | list }}"

    - name: Reset SSH connection so group membership applies
      ansible.builtin.meta: reset_connection
