---
# Start / stop / restart / check any systemd service.
# Usage:
#   ansible-playbook playbooks/basic/manage-service.yml -e service=nginx -e service_action=restarted
#   ansible-playbook playbooks/basic/manage-service.yml -e service=nginx -e service_action=status
# service_action: started | stopped | restarted | reloaded | status
- name: Manage a systemd service
  hosts: all
  become: true
  gather_facts: false
  vars:
    service_action: status
  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - service is defined
          - service_action in ['started', 'stopped', 'restarted', 'reloaded', 'status']
        fail_msg: "Pass -e service=<name> -e service_action=started|stopped|restarted|reloaded|status"

    - name: Change service state
      ansible.builtin.systemd_service:
        name: "{{ service }}"
        state: "{{ service_action }}"
      when: service_action != 'status'

    - name: Get service status
      ansible.builtin.command: systemctl status {{ service }} --no-pager -l
      register: svc_status
      failed_when: false
      changed_when: false

    - name: Show status
      ansible.builtin.debug:
        var: svc_status.stdout_lines
