---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint

      - name: yamllint
        run: yamllint -f github .

      - name: ansible-lint
        run: ansible-lint

      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Syntax check all playbooks
        run: |
          for f in playbooks/*/*.yml; do
            ansible-playbook --syntax-check "$f"
          done
