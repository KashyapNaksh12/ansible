---
# Install a LAMP stack on Amazon Linux 2023: Apache (httpd), MariaDB 10.5 and PHP via php-fpm.
# Removes MariaDB's anonymous users and test database, and optionally creates an app database and user.
# The DB password comes from vars/vault.yml (vault_lamp_db_password) or -e lamp_db_password=...
# Usage:
#   ansible-playbook playbooks/medium/lamp-stack.yml                              # web + db, no app database
#   ansible-playbook playbooks/medium/lamp-stack.yml --ask-vault-pass -e lamp_db_name=shop -e lamp_db_user=shop
#   ansible-playbook playbooks/medium/lamp-stack.yml -e lamp_db_name=shop -e lamp_db_user=shop -e lamp_db_reset_password=true --ask-vault-pass
- name: LAMP stack
  hosts: all
  become: true
  gather_facts: true
  vars:
    lamp_packages:
      - httpd
      - mariadb105-server
      - php
      - php-cli
      - php-fpm
      - php-mysqlnd
      - php-mbstring
      - php-xml
      - php-gd
      - php-opcache
      - php-intl
    lamp_doc_root: /var/www/html
    lamp_web_owner: apache
    # Leave lamp_db_name empty to skip creating an app database
    lamp_db_name: ""
    lamp_db_user: ""
    lamp_db_password: "{{ vault_lamp_db_password | default('') }}"
    lamp_db_reset_password: false   # true sets the password again on an existing user
    lamp_php_ini:
      memory_limit: 256M
      upload_max_filesize: 64M
      post_max_size: 64M
      max_execution_time: "60"
      date.timezone: "{{ timezone }}"
      expose_php: "Off"
  pre_tasks:
    - name: Load vault secrets when an app database is requested
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/vars/vault.yml"
      when:
        - lamp_db_name | length > 0
        - vault_lamp_db_password is undefined
        - (repo_root ~ '/vars/vault.yml') is file

    - name: Validate input
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Amazon'
          - ansible_facts['distribution_major_version'] == '2023'
        fail_msg: "This playbook supports Amazon Linux 2023 only (Amazon Linux 2 is end of life)"

    - name: Validate app database settings
      ansible.builtin.assert:
        that:
          - lamp_db_name is match('^[A-Za-z0-9_]+$')
          - lamp_db_user is match('^[A-Za-z0-9_]{1,32}$')
          - lamp_db_password | length >= 12
          - lamp_db_password is not search("['\\\\]")
        fail_msg: >-
          Need lamp_db_name and lamp_db_user (letters, digits, _) and a password of at least 12 characters
          without quotes or backslashes, set as vault_lamp_db_password in vars/vault.yml or -e lamp_db_password=...
      when: lamp_db_name | length > 0
      no_log: true

  tasks:
    - name: Install LAMP packages
      ansible.builtin.dnf:
        name: "{{ lamp_packages }}"
        state: present

    - name: Hide Apache version in headers and error pages
      ansible.builtin.copy:
        dest: /etc/httpd/conf.d/zz-security.conf
        mode: "0644"
        content: |
          ServerTokens Prod
          ServerSignature Off
          TraceEnable Off
        validate: /usr/sbin/httpd -t -f /etc/httpd/conf/httpd.conf -C "Include %s"
      notify: Reload httpd

    - name: Tune php.ini
      community.general.ini_file:
        path: /etc/php.ini
        section: PHP
        option: "{{ item.key }}"
        value: "{{ item.value }}"
        mode: "0644"
      loop: "{{ lamp_php_ini | dict2items }}"
      loop_control:
        label: "{{ item.key }} = {{ item.value }}"
      notify: Restart php-fpm

    - name: Start and enable services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [mariadb, php-fpm, httpd]

    - name: Deploy default index.php (kept if one already exists)
      ansible.builtin.copy:
        dest: "{{ lamp_doc_root }}/index.php"
        owner: "{{ lamp_web_owner }}"
        group: "{{ lamp_web_owner }}"
        mode: "0644"
        force: false
        content: |
          <?php
          $db = extension_loaded('mysqli') ? 'available' : 'missing';
          ?>
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title><?= htmlspecialchars(gethostname()) ?></title></head>
          <body>
            <h1>LAMP stack deployed by Ansible</h1>
            <p>Host: <?= htmlspecialchars(gethostname()) ?></p>
            <p>PHP <?= PHP_VERSION ?> with mysqli <?= $db ?></p>
          </body>
          </html>

    # MariaDB root on localhost authenticates over the unix socket, so `mysql` as root needs no password.
    - name: Check for anonymous users and the test database
      ansible.builtin.command:
        argv:
          - mysql
          - -N
          - -B
          - -e
          - >-
            SELECT (SELECT COUNT(*) FROM mysql.user WHERE User=''),
            (SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='test')
      register: db_insecure
      changed_when: false

    - name: Remove anonymous users and the test database
      ansible.builtin.command:
        argv: [mysql]
        stdin: |
          DELETE FROM mysql.global_priv WHERE User='';
          DROP DATABASE IF EXISTS test;
          DELETE FROM mysql.db WHERE Db='test' OR Db='test\_%';
          FLUSH PRIVILEGES;
      when: db_insecure.stdout.split() | map('int') | sum > 0
      changed_when: true

    - name: Create app database and user
      when: lamp_db_name | length > 0
      block:
        - name: Check whether the app user exists
          ansible.builtin.command:
            argv: [mysql, -N, -B, -e, "SELECT COUNT(*) FROM mysql.user WHERE User='{{ lamp_db_user }}' AND Host='localhost'"]
          register: db_user_exists
          changed_when: false

        - name: Check whether the app database exists
          ansible.builtin.command:
            argv: [mysql, -N, -B, -e, "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='{{ lamp_db_name }}'"]
          register: db_exists
          changed_when: false

        - name: Create app database
          ansible.builtin.command:
            argv: [mysql, -e, "CREATE DATABASE `{{ lamp_db_name }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"]
          when: db_exists.stdout | int == 0
          changed_when: true

        # Password goes over stdin so it never shows up in the process list
        - name: Create app user or reset its password
          ansible.builtin.command:
            argv: [mysql]
            stdin: |
              CREATE USER IF NOT EXISTS '{{ lamp_db_user }}'@'localhost';
              ALTER USER '{{ lamp_db_user }}'@'localhost' IDENTIFIED BY '{{ lamp_db_password }}';
              GRANT ALL PRIVILEGES ON `{{ lamp_db_name }}`.* TO '{{ lamp_db_user }}'@'localhost';
              FLUSH PRIVILEGES;
          when: db_user_exists.stdout | int == 0 or lamp_db_reset_password | bool
          changed_when: true
          no_log: true

        - name: Grant app user access to the database
          ansible.builtin.command:
            argv: [mysql, -e, "GRANT ALL PRIVILEGES ON `{{ lamp_db_name }}`.* TO '{{ lamp_db_user }}'@'localhost'"]
          when: db_user_exists.stdout | int > 0 and db_exists.stdout | int == 0
          changed_when: true

  post_tasks:
    - name: Flush handlers before checking the site
      ansible.builtin.meta: flush_handlers

    - name: Check that Apache serves PHP
      ansible.builtin.uri:
        url: http://127.0.0.1/index.php
        return_content: true
      register: site
      retries: 5
      delay: 2
      until: site.status == 200
      failed_when: site.status != 200 or '<?php' in site.content

    - name: Show versions
      ansible.builtin.command:
        argv: [sh, -c, "httpd -v | head -1; mysql --version; php -v | head -1"]
      register: versions
      changed_when: false

    - name: Show summary
      ansible.builtin.debug:
        msg: "{{ versions.stdout_lines + ['App database: ' ~ (lamp_db_name ~ ' (user ' ~ lamp_db_user ~ ')' if lamp_db_name else 'not requested')] }}"

  handlers:
    - name: Reload httpd
      ansible.builtin.systemd_service:
        name: httpd
        state: reloaded

    - name: Restart php-fpm
      ansible.builtin.systemd_service:
        name: php-fpm
        state: restarted
