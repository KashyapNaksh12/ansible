---
# Shared defaults for every host. Override per run with -e "var=value".

timezone: "Asia/Kolkata"

common_packages:
  - git
  - vim
  - curl
  - wget
  - unzip
  - htop
  - tree
  - jq
  - tar
  - net-tools
  - lsof

# Health-check thresholds (percent)
disk_usage_threshold: 85
memory_usage_threshold: 90

# Repo root on the control node (playbooks live two levels down)
repo_root: "{{ playbook_dir | dirname | dirname }}"

# Where fetched backups/reports land on the control node
local_backup_dir: "{{ repo_root }}/backups"
local_report_dir: "{{ repo_root }}/reports"
