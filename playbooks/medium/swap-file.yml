---
# Create (or remove) a swap file, persist it in /etc/fstab and tune swappiness.
# Useful on small EC2 instances (t3.micro etc.) that ship with no swap.
# To change the size of an existing swap file, run with swap_state=absent first.
# Usage:
#   ansible-playbook playbooks/medium/swap-file.yml
#   ansible-playbook playbooks/medium/swap-file.yml -e swap_size_mb=4096 -e swappiness=20
#   ansible-playbook playbooks/medium/swap-file.yml -e swap_state=absent
- name: Swap file
  hosts: all
  become: true
  gather_facts: false
  vars:
    swap_file: /swapfile
    swap_size_mb: 2048
    swappiness: 10
    swap_state: present             # present | absent
  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - swap_state in ['present', 'absent']
          - swap_size_mb | int > 0

    - name: Check existing swap file
      ansible.builtin.stat:
        path: "{{ swap_file }}"
      register: swap_stat

    - name: Get active swap devices
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: active_swap
      changed_when: false

    - name: Stop if an existing swap file has a different size
      ansible.builtin.assert:
        that: swap_stat.stat.size == (swap_size_mb | int) * 1024 * 1024
        fail_msg: >-
          {{ swap_file }} is {{ (swap_stat.stat.size / 1048576) | int }} MB, wanted {{ swap_size_mb }} MB.
          Run with -e swap_state=absent first, then create it again.
      when: swap_state == 'present' and swap_stat.stat.exists

    - name: Create swap file
      when: swap_state == 'present'
      block:
        - name: Allocate and format swap file
          ansible.builtin.shell: umask 077 && dd if=/dev/zero of={{ swap_file }} bs=1M count={{ swap_size_mb }} && mkswap {{ swap_file }}
          args:
            creates: "{{ swap_file }}"

        - name: Restrict swap file permissions
          ansible.builtin.file:
            path: "{{ swap_file }}"
            owner: root
            group: root
            mode: "0600"

        - name: Enable swap file
          ansible.builtin.command: swapon {{ swap_file }}
          when: swap_file not in active_swap.stdout_lines
          changed_when: true

        - name: Persist swap in /etc/fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^{{ swap_file | regex_escape }}\s'
            line: "{{ swap_file }} none swap defaults 0 0"

        - name: Set vm.swappiness
          ansible.posix.sysctl:
            name: vm.swappiness
            value: "{{ swappiness }}"
            sysctl_file: /etc/sysctl.d/99-swap.conf
            reload: true

    - name: Remove swap file
      when: swap_state == 'absent'
      block:
        - name: Disable swap file
          ansible.builtin.command: swapoff {{ swap_file }}
          when: swap_file in active_swap.stdout_lines
          changed_when: true

        - name: Remove swap from /etc/fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^{{ swap_file | regex_escape }}\s'
            state: absent

        - name: Delete swap file
          ansible.builtin.file:
            path: "{{ swap_file }}"
            state: absent

    - name: Show memory and swap
      ansible.builtin.command: free -m
      register: free_out
      changed_when: false

    - name: Memory summary
      ansible.builtin.debug:
        var: free_out.stdout_lines
