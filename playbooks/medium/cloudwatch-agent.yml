---
# Install the Amazon CloudWatch agent and ship memory, disk and swap metrics plus selected log files.
# EC2 does not report memory or disk usage on its own; this fills that gap.
# The instance role needs the CloudWatchAgentServerPolicy managed policy.
# Usage:
#   ansible-playbook playbooks/medium/cloudwatch-agent.yml
#   ansible-playbook playbooks/medium/cloudwatch-agent.yml -e cw_namespace=MyApp -e cw_interval=300
#   ansible-playbook playbooks/medium/cloudwatch-agent.yml -e '{"cw_log_files": []}'   # metrics only
- name: CloudWatch agent
  hosts: all
  become: true
  gather_facts: false
  vars:
    cw_namespace: CWAgent
    cw_interval: 60                     # seconds between metric samples
    cw_log_retention_days: 30
    cw_log_files:                       # field names follow the agent's collect_list format
      - file_path: /var/log/messages
        log_group_name: /ec2/messages
      - file_path: /var/log/secure
        log_group_name: /ec2/secure
    cw_config_path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    cw_metrics_config:
      agent:
        run_as_user: root
      metrics:
        namespace: "{{ cw_namespace }}"
        append_dimensions:
          InstanceId: "${aws:InstanceId}"
          InstanceType: "${aws:InstanceType}"
          AutoScalingGroupName: "${aws:AutoScalingGroupName}"
        metrics_collected:
          mem:
            measurement: [mem_used_percent]
          swap:
            measurement: [swap_used_percent]
          disk:
            measurement: [used_percent]
            resources: ["/"]
            ignore_file_system_types: [sysfs, devtmpfs, tmpfs, overlay]
    cw_logs_config:
      logs:
        logs_collected:
          files:
            collect_list: >-
              {{ cw_log_files | map('combine', {'log_stream_name': '{instance_id}',
                 'retention_in_days': cw_log_retention_days | int}) | list }}
    # The interval is merged here so it stays an integer in the JSON.
    # The agent rejects an empty collect_list, so the logs section is only added when there are files.
    cw_config: >-
      {{ cw_metrics_config
         | combine({'agent': {'metrics_collection_interval': cw_interval | int}}, recursive=True)
         | combine(cw_logs_config if cw_log_files | length > 0 else {}) }}
  tasks:
    - name: Install CloudWatch agent
      ansible.builtin.package:
        name: amazon-cloudwatch-agent
        state: present

    - name: Write agent config
      ansible.builtin.copy:
        dest: "{{ cw_config_path }}"
        content: "{{ cw_config | to_nice_json }}\n"
        mode: "0644"
      notify: Load agent config

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start agent
      ansible.builtin.systemd_service:
        name: amazon-cloudwatch-agent
        state: started
        enabled: true

    - name: Get agent status
      ansible.builtin.command: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -m ec2 -a status
      register: cw_status
      changed_when: false

    - name: Show agent status
      ansible.builtin.debug:
        msg: "{{ (cw_status.stdout | from_json).status }} (config {{ (cw_status.stdout | from_json).configstatus }})"

  handlers:
    - name: Load agent config
      ansible.builtin.command: >-
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a fetch-config -m ec2 -s -c file:{{ cw_config_path }}
      changed_when: true
