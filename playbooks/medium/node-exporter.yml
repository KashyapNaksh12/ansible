---
# Install Prometheus node_exporter as a systemd service (port 9100).
# Downloads the release on each host and verifies its sha256 checksum.
# Open port 9100 in the security group only to your Prometheus server.
# Usage:
#   ansible-playbook playbooks/medium/node-exporter.yml
#   ansible-playbook playbooks/medium/node-exporter.yml -e node_exporter_version=1.8.2
#   ansible-playbook playbooks/medium/node-exporter.yml -e node_exporter_state=absent
- name: Prometheus node_exporter
  hosts: all
  become: true
  gather_facts: true
  vars:
    node_exporter_version: "1.8.2"
    node_exporter_port: 9100
    node_exporter_state: present        # present | absent
    node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
    node_exporter_name: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
    node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - node_exporter_state in ['present', 'absent']
          - ansible_facts['architecture'] in ['x86_64', 'aarch64']

    - name: Install node_exporter
      when: node_exporter_state == 'present'
      block:
        - name: Create node_exporter system user
          ansible.builtin.user:
            name: node_exporter
            system: true
            shell: /sbin/nologin
            create_home: false

        - name: Download release
          ansible.builtin.get_url:
            url: "{{ node_exporter_url }}/{{ node_exporter_name }}.tar.gz"
            dest: "/tmp/{{ node_exporter_name }}.tar.gz"
            checksum: "sha256:{{ node_exporter_url }}/sha256sums.txt"
            mode: "0644"

        - name: Unpack release
          ansible.builtin.unarchive:
            src: "/tmp/{{ node_exporter_name }}.tar.gz"
            dest: /tmp
            remote_src: true
            creates: "/tmp/{{ node_exporter_name }}/node_exporter"

        - name: Install binary
          ansible.builtin.copy:
            src: "/tmp/{{ node_exporter_name }}/node_exporter"
            dest: /usr/local/bin/node_exporter
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          notify: Restart node_exporter

        - name: Install systemd unit
          ansible.builtin.copy:
            dest: /etc/systemd/system/node_exporter.service
            mode: "0644"
            content: |
              [Unit]
              Description=Prometheus node_exporter
              After=network-online.target
              Wants=network-online.target

              [Service]
              User=node_exporter
              Group=node_exporter
              ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ node_exporter_port }}
              Restart=on-failure

              [Install]
              WantedBy=multi-user.target
          notify: Restart node_exporter

        - name: Enable and start node_exporter
          ansible.builtin.systemd_service:
            name: node_exporter
            state: started
            enabled: true
            daemon_reload: true

        - name: Flush handlers before checking metrics
          ansible.builtin.meta: flush_handlers

        - name: Check metrics endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
            return_content: false
          register: metrics
          retries: 5
          delay: 2
          until: metrics.status == 200

    - name: Remove node_exporter
      when: node_exporter_state == 'absent'
      block:
        - name: Stop and disable node_exporter
          ansible.builtin.systemd_service:
            name: node_exporter
            state: stopped
            enabled: false
          failed_when: false

        - name: Remove files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/node_exporter.service
            - /usr/local/bin/node_exporter

        - name: Remove node_exporter user
          ansible.builtin.user:
            name: node_exporter
            state: absent

        - name: Reload systemd
          ansible.builtin.systemd_service:
            daemon_reload: true

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd_service:
        name: node_exporter
        state: restarted
        daemon_reload: true
